name: テスト（CI）

# トリガー: push（mainへ）とpull_request の両方で実行
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # 手動実行ボタンも有効化

# 実行時間の上限（暴走防止）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 全215+件のテストを実行
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1) リポジトリのコードを取得
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      # 2) Python 3.9 を準備（ローカル venv と一致）
      - name: Python 3.9 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # 本番コンテナ（python:3.12-slim）と揃える
          cache: pip

      # 3) 依存をインストール
      - name: 依存パッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4) 構文チェック（壊れたファイルがあれば早期失敗）
      - name: 全Pythonファイルの構文チェック
        run: |
          python -m py_compile \
            app.py db.py \
            utils/*.py \
            scripts/*.py \
            pages/*.py

      # 5) ピュアユニットテスト（DB依存なし・最も速い）
      - name: テスト結果サマリ
        if: always()
        run: |
          echo "## ✅ CI 実行完了" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "コミット: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "ブランチ: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "トリガー: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "実行されたテストスイート: 13本（合計 215+ 件）" >> $GITHUB_STEP_SUMMARY
      - name: 安全テスト一括（正= test_e2e/run_ci_tests.py の SAFE リスト）
        run: python test_e2e/run_ci_tests.py
