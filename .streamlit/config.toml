[theme]
primaryColor = "#006B5A"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[client]
# 標準のページナビを無効化（2026-07-06）。
# クイックナビ（page_layout.render_quick_nav）が全ページを網羅しており、
# CSSで隠す方式だとページ切替時に素のファイル名表記が一瞬見える（FOUC）ため、
# フレームワーク側で最初から描画させない。
showSidebarNavigation = false
